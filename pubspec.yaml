name: star_mesas_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0
  riverpod: ^3.4.3
  go_router: ^18.1.2
  google_fonts: ^9.0.0
  hugeicons: ^1.2.0
  geolocator: ^14.1.2
  cached_network_image: ^4.0.6
  file_picker: ^13.3.0
  shared_preferences: ^2.5.6
  skills: ^0.0.1
  another_flushbar: ^2.2.4
  open_file: ^4.0.0
  path_provider: ^2.1.6
  flutter_svg: ^2.3.2
  file_saver: ^0.7.0
  excel_plus: ^2.29.1
  pdf: ^3.13.1
  printing: ^5.15.1
  intl: ^0.20.3
  fl_chart: ^1.3.0
  lottie: ^3.8.0
  flutter_secure_storage: ^11.2.0
  sqflite_common_ffi_web: ^1.2.0
  sqflite: ^2.4.5
  device_info_plus: ^13.3.0
  sqflite_common_ffi: ^2.4.5
  flutter_colorpicker: ^1.1.0
  path: ^1.9.1
  permission_handler: ^13.0.2
  print_bluetooth_thermal: ^1.2.5
  bcrypt: ^1.2.0
  window_manager: ^0.5.2
  uuid: ^4.6.0
  flutter_riverpod: ^3.4.3
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.1
  pointycastle: ^4.0.0
  crypto: ^3.0.8
  mysql_client_plus: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-LightItalic.ttf
          style: italic
          weight: 300

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic

    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic

    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Italic.ttf
          style: italic

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
